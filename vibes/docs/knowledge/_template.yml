# ===================================================
# knowledge テンプレート (試行錯誤ノウハウ)
#
# 実作業で記録する際はコメントや装飾を入れず値だけを簡潔に記述する。
# 記録する: 再利用可能な手順・落とし穴・非決定の運用事実。
# 記録しない: 秘密/認証情報/PII、temp log、生成物そのもの、その場限りの会話メモ。
# 「なぜ決めたか」は ADR (vibes/docs/adr/)、安定した詳細仕様は specs/ へ。
# ===================================================

# 連番 (0埋め不要)
id: 1

# 知見の表題
title: ""

# 記録日
date: YYYY-MM-DD

# 対象技術・範囲
scope: ""

# --- 知見 ---
# 1件以上。試行錯誤で得た再利用可能な情報を記録する。
findings:
  - id: snake_case_id        # 知見を一意に識別するID
    area: ""                 # 分類 (例: scaffold 配布, role 自認)
    problem: ""              # 何が問題だったか
    solution: ""             # どう解決したか
    detail: ""               # 補足 (省略可)
    caveat: ""               # 注意点・落とし穴 (省略可)

# --- 制約 ---
# 技術的制約やハマりポイント (省略可)
constraints:
  - name: ""                 # 制約の名前
    detail: ""               # 内容
    workaround: ""           # 回避策
